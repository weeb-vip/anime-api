# Analysis excludes machine-written files.
#
# Every schema change regenerates graph/generated, and gqlgen emits a few
# hundred lines of marshalling and field-resolver boilerplate per type that is
# structurally identical to every other type's. Sonar scored that as 44-57%
# duplicated new code on four consecutive pull requests -- #54, #55, #56 and
# #58 -- and failed the quality gate on each, while the hand-written change in
# the same PR scored 0%.
#
# The finding is not actionable either way: nothing here is edited by hand, and
# any change would be overwritten by the next `make gql`. Leaving it in only
# trains people to ignore a red gate, which costs more than it catches.
#
# Deliberately narrower than all of graph/. The resolvers next to these files
# are scaffolded by gqlgen but their bodies are written by hand, so they stay
# in analysis.
sonar.exclusions=graph/generated/**,graph/model/models_gen.go,metrics/mocks/**
